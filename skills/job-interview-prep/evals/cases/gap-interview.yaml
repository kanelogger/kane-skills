id: gap-interview
title: 空窗期面试回答与反问
input:
  prompt: |
    明天社招面试。我被裁后空窗八个月，照顾过家人，也做了一个公开数据分析项目，没有其他 offer。请帮我准备离职和空窗的回答，并给两个能了解岗位真实情况的反问。
judge:
  type: agent_judge
  model: openai/gpt-4
  criteria:
    - "回答基于用户提供的被裁、照顾家人和个人项目，不杜撰裁员范围、疾病细节或其他 offer。"
    - "说明个人分析项目如何证明当前能力，同时不冒充正式工作成果。"
    - "反问帮助确认实际职责或成功标准，不把薪资及工作条件问题污名化。"
  pass_threshold: 0.8
