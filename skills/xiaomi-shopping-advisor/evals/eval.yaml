schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: codex

cases:
  files:
    - evals/cases/xiaomi-giant-pen.yaml
    - evals/cases/xiaomi-rainbow-battery.yaml
  defaults:
    timeout_seconds: 900
    max_turns: 20
    collect_artifacts:
      - "shopping-report/**"
  parallelism: 1

benchmark:
  enabled: false

report:
  formats: [json, html]
  artifacts: [transcript]
