id: no-launch
title: 未上线创业项目的价值解码
input:
  prompt: |
    我在一家创业公司负责过一个预约产品。团队做了原型，我访谈了六位潜在用户，后来因为预算停止，没有上线，也没有增长数据。老板定的大方向，我负责把反馈整理成流程改动。帮我盘点这段经历的求职价值。
judge:
  type: agent_judge
  model: openai/gpt-4
  criteria:
    - "明确区分已完成的原型、访谈和流程改动与未上线、没有增长数据的事实。"
    - "区分老板确定方向与候选人整理反馈的个人贡献，不虚构领导或商业结果。"
    - "给出可复用的价值点和具体待补证项，而不是仅因项目失败就否定经历。"
  pass_threshold: 0.8
