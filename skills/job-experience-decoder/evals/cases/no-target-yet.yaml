id: no-target-yet
title: 未定方向时保留不同经历
input:
  prompt: |
    我还没决定投什么岗位。过去两年做过客户资料数字化，也组织过四次内部读书会。前者有流程文档，后者只记得参与人数大概十几人，没有保留签到。帮我先做价值点资产库。
judge:
  type: agent_judge
  model: openai/gpt-4
  criteria:
    - "保留两类不同经历，不因为目前没有目标 JD 就判断读书会与求职无关或将其删除。"
    - "区分数字化工作的流程文档与读书会人数缺少记录的证据状态。"
    - "不在 JD 无关的资产库中给两段经历作高价值或暂不突出的岗位排序。"
  pass_threshold: 0.8
