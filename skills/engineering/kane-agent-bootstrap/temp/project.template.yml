# 本目录当前的项目环境声明，由 Agent 开始任务时读取。
# []/{} 表示已确认没有相应项目要求；null 表示尚未声明。
# 本文件不保存环境探测结果，不授予权限，不自动执行命令。
schema_version: 1

project:
  name: "<project-name>"              # 必填；仓库、任务记录与产物使用的唯一项目名，小写字母、数字和连字符
  store_name: "<store_name>"          # 必填；指标或数据存储名，小写字母、数字和下划线
  purpose: "<服务对象与最重要的质量目标>"  # 可选；一句话，供 Agent 判断任务相关性
  language: "zh-CN"                   # 可选；文档与沟通的默认语言
  timezone: "Asia/Shanghai"           # 可选；任务时间与调度时间使用的时区

platform:
  engine: "<engine>"                  # 必填；查询引擎，例如 duckdb，须与部署环境一致
  pipeline_framework: "<framework>"   # 必填；数据管道框架，例如 spark_python，填项目实际入口名称
  duckdb_dir: "<warehouse-dir>"       # 必填；DuckDB 数据库目录，相对仓库根，且须在 .gitignore 中排除

# 以下为使用约定，不描述本机安装状态或某一台机器的历史记录。
conventions:
  versions: 以项目依赖清单和锁文件为准；本文件不重复声明工具或库版本
  paths: 只写相对仓库根的路径；不写用户目录、绝对路径或跨 worktree 路径
  secrets: 不保存凭据、令牌和私有地址；凭据留在本地 .env* 或外部系统
  identifiers: 修改 name 或 store_name 前核对任务记录、产物路径与外部系统引用，并在同一变更中同步

environment:
  supported_platforms: null
  toolchains: []                        # 未要求固定语言、运行时或包管理器。
  commands: {}                          # 尚无项目安装、测试、构建或发布入口。
  services: []                          # 无应用服务或数据库。
  tools: []                             # 无项目必需的额外技能、插件或 MCP 配置。
  variables: []                         # 无项目必需环境变量。
  local_paths: {}                       # 未配置本地状态、缓存或生成报告目录。

requirements:
  filesystem:
    - path: "."
      access: ["read", "write"]
      purpose: "按任务读取或维护规范文档；实际操作服从当前授权与环境权限"
  network: []                           # 核对、维护本目录文档不依赖网络。

guides:
  environment: "docs/agent-environment/README.md"
  commands: "docs/agent-environment/commands.md"
