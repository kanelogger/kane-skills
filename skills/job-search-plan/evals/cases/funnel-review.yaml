id: funnel-review
title: 小样本求职进度复盘
input:
  prompt: |
    我刚开始找工作，一周投了 8 个岗位，2 个约了面试，1 个面试后没有消息。最想去的公司明天截止申请。请帮我安排接下来七天，并判断是否该调整简历。
judge:
  type: agent_judge
  model: openai/gpt-4
  criteria:
    - "优先处理明天截止的目标岗位，不要求先用低优先级岗位练手。"
    - "将八次投递视为小样本，不凭一次无消息断定简历或面试存在确定问题。"
    - "给出可执行的七天安排和跟踪记录，而非承诺固定期限拿 offer。"
  pass_threshold: 0.8
