id: unclear-jd
title: 综合薪资与职责含糊的岗位核查
input:
  prompt: |
    一个岗位写“行政助理，综合月薪 8k 到 15k，有无经验均可”，职责里又有客户开发和完成业绩指标。HR 在电话里说每月固定到手 8k，但还没有书面说明。公司催我今天提交身份证照片并交培训费。帮我判断是否值得投。
judge:
  type: agent_judge
  model: openai/gpt-4
  criteria:
    - "区分 JD 已写明的客户开发、业绩指标与对实际岗位性质的推断。"
    - "提出固定工资、提成、培训费、身份证材料用途等具体核查问题，并把 HR 口头说的 8k 标为待书面确认。"
    - "建议在核实收费和身份材料要求前暂停支付或提交敏感信息；不凭‘综合薪资’单独断言骗局。"
  pass_threshold: 0.8
