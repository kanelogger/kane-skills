name: Deploy skill catalog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "assets/brand/kane-skills-armory-icon.svg"
      - "README.md"
      - "README-CN.md"
      - "skills/**"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Bun from npm
        run: >-
          npm install --prefix "$RUNNER_TEMP/kane-pages" --registry https://registry.npmjs.org
          --fetch-timeout 30000 --fetch-retries 0 --ignore-scripts --no-audit --no-fund
          --no-package-lock @oven/bun-linux-x64@1.3.14
      - name: Build site
        run: '"$RUNNER_TEMP/kane-pages/node_modules/@oven/bun-linux-x64/bin/bun" site/build.ts'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
